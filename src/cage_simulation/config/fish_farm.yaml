fish_farm:
  # Coordinates are ENU metres relative to the existing SITL home/map origin.
  # The farm is centered around the current GPS_A/GPS_B operation area.
  rows: 6
  cols: 10
  cell_size:
    x: 12.0
    y: 12.0
  origin_x: 70.0
  origin_y: -6.0
  yaw_deg: 0.0

  beam:
    width: 0.25
    height: 0.20
    z: 0.45

  floats:
    enabled: true
    spacing: 4.0
    radius: 0.30
    length: 0.90
    blue_ratio: 0.70

  net:
    enabled: true
    rows: [1, 3, 5]
    width: 1.20
    z: 0.62
    height_jitter: 0.08
    lateral_jitter: 0.20

  realism:
    random_seed: 42
    beam_position_jitter: 0.08
    beam_yaw_jitter_deg: 0.40
    float_missing_probability: 0.03
